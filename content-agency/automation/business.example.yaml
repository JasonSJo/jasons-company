# 업체 프로필 — build_calendar.py 의 입력. 업체당 이 파일 하나로 30일 캘린더가 나온다.
industry: 요식업            # 요식업 | 병의원 | 뷰티 | 전문서비스
brand: 성수 파스타랩
region: 성수동
keyword: 성수동 파스타       # 검색 핵심 키워드
situation: 데이트            # 요식업 '지역+상황' 키워드용
symptom: 잇몸 출혈           # 병의원 '증상' 키워드용
strengths: 생면 파스타, 예약제 소규모 다이닝, 시즌 메뉴
target: 20~30대 데이트·모임 고객
menus:                       # 대표 메뉴/시술/서비스 (토픽 순환에 사용)
  - 트러플 파스타
  - 라구 파스타
  - 시즌 리조또
  - 하우스 와인
