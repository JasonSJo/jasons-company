<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>콘텐츠 검수 큐 · 콘텐츠하다</title>
<style>
  :root{--bg:#f6f7f9;--card:#fff;--fg:#14161a;--soft:#565d6b;--mute:#8a92a1;--border:#e7e9ee;--brand:#3b5bff;--ok:#12a150;--hold:#d99000;--no:#e5484d}
  @media(prefers-color-scheme:dark){:root{--bg:#0c0e13;--card:#151922;--fg:#f2f4f8;--soft:#aab2c2;--mute:#7a8393;--border:#242a36}}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Malgun Gothic",sans-serif;background:var(--bg);color:var(--fg);line-height:1.55}
  header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--border);padding:16px 20px;z-index:5}
  h1{margin:0;font-size:19px}
  .sub{color:var(--mute);font-size:13px;margin-top:4px}
  .bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
  .bar input[type=file]{font-size:13px}
  .counts{margin-left:auto;display:flex;gap:12px;font-size:13px;font-weight:700}
  .counts span{color:var(--soft)}
  main{max-width:920px;margin:0 auto;padding:20px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px 18px;margin-bottom:14px}
  .row{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
  .tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
  .tag{font-size:11px;font-weight:700;background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:2px 8px;color:var(--soft)}
  .card h3{margin:2px 0 6px;font-size:16px}
  pre{white-space:pre-wrap;word-break:break-word;font-size:12.5px;color:var(--soft);background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px;max-height:160px;overflow:auto;margin:8px 0 0}
  .status{font-size:12px;font-weight:800;padding:3px 9px;border-radius:999px;white-space:nowrap}
  .s-검수대기{color:var(--mute);background:var(--bg);border:1px solid var(--border)}
  .s-승인{color:#fff;background:var(--ok)}
  .s-보류{color:#fff;background:var(--hold)}
  .s-반려{color:#fff;background:var(--no)}
  .acts{display:flex;gap:6px;margin-top:10px}
  button{font-family:inherit;font-weight:700;font-size:13px;border-radius:8px;padding:7px 12px;cursor:pointer;border:1px solid var(--border);background:var(--card);color:var(--fg)}
  button:hover{background:var(--bg)}
  .b승인{border-color:var(--ok);color:var(--ok)} .b보류{border-color:var(--hold);color:var(--hold)} .b반려{border-color:var(--no);color:var(--no)}
  .primary{background:var(--brand);color:#fff;border-color:var(--brand)}
  .empty{text-align:center;color:var(--mute);padding:48px 0}
  code{background:var(--bg);padding:1px 6px;border-radius:5px;font-size:12px}
</style>
</head>
<body>
<header>
  <h1>콘텐츠 검수 큐</h1>
  <div class="sub">생성 초안을 승인/보류/반려로 관리합니다. 발행은 <b>승인</b>된 항목만.<br>
    규제 금지어 자동 검출과 타깃·캘린더·리포트까지 함께 보려면 <a href="../app/index.html" style="color:var(--brand);font-weight:700">운영 콘솔</a> 을 사용하세요(이 화면에서 내린 판정은 콘솔이 이어받습니다).</div>
  <div class="bar">
    <input type="file" id="picker" accept="application/json"/>
    <button id="reload">output/manifest.json 불러오기</button>
    <button class="primary" id="export">승인본 내보내기</button>
    <div class="counts" id="counts"></div>
  </div>
</header>
<main id="list"><div class="empty">manifest.json 을 불러오세요.<br>
  <code>python generate_content.py</code> 실행 후 <code>output/manifest.json</code> 이 생성됩니다.</div></main>

<script>
  var STATES = ["검수대기","승인","보류","반려"];
  var items = [];
  var KEY = "review-status";

  function savedStatus(){ try { return JSON.parse(localStorage.getItem(KEY) || "{}"); } catch(_) { return {}; } }
  function setStatus(slug, s){ var m = savedStatus(); m[slug] = s; localStorage.setItem(KEY, JSON.stringify(m)); render(); }

  function load(data){
    var overrides = savedStatus();
    items = data.map(function(it){ return Object.assign({}, it, { status: overrides[it.slug] || it.status || "검수대기" }); });
    render();
  }

  function render(){
    var list = document.getElementById("list");
    if(!items.length){ list.innerHTML = '<div class="empty">항목이 없습니다.</div>'; document.getElementById("counts").textContent=""; return; }
    var c = {검수대기:0,승인:0,보류:0,반려:0};
    list.innerHTML = items.map(function(it){
      c[it.status] = (c[it.status]||0)+1;
      return '<div class="card"><div class="row"><div>'
        + '<div class="tags"><span class="tag">'+it.industry+'</span><span class="tag">'+it.channel+'</span>'
        + (it.brand?'<span class="tag">'+it.brand+'</span>':'')+'<span class="tag">'+it.mode+'</span></div>'
        + '<h3>'+esc(it.topic)+'</h3></div>'
        + '<span class="status s-'+it.status+'">'+it.status+'</span></div>'
        + '<pre>'+esc(it.preview||"")+'</pre>'
        + '<div class="acts">'
        + '<button class="b승인" onclick="setStatus(\''+it.slug+'\',\'승인\')">승인</button>'
        + '<button class="b보류" onclick="setStatus(\''+it.slug+'\',\'보류\')">보류</button>'
        + '<button class="b반려" onclick="setStatus(\''+it.slug+'\',\'반려\')">반려</button>'
        + '<button onclick="setStatus(\''+it.slug+'\',\'검수대기\')">되돌리기</button>'
        + '</div></div>';
    }).join("");
    document.getElementById("counts").innerHTML =
      '<span>대기 '+c.검수대기+'</span><span style="color:var(--ok)">승인 '+c.승인+'</span>'
      +'<span style="color:var(--hold)">보류 '+c.보류+'</span><span style="color:var(--no)">반려 '+c.반려+'</span>';
  }

  function esc(s){ return String(s).replace(/[&<>]/g, function(m){ return {'&':'&amp;','<':'&lt;','>':'&gt;'}[m]; }); }

  document.getElementById("picker").addEventListener("change", function(e){
    var file = e.target.files[0]; if(!file) return;
    file.text().then(function(t){ load(JSON.parse(t)); }).catch(function(){ alert("JSON 파싱 실패"); });
  });
  document.getElementById("reload").addEventListener("click", function(){
    fetch("output/manifest.json").then(function(r){ if(!r.ok) throw 0; return r.json(); })
      .then(load)
      .catch(function(){ alert("output/manifest.json 을 찾을 수 없습니다.\n로컬 서버로 열거나(python -m http.server) 파일 선택을 이용하세요."); });
  });
  document.getElementById("export").addEventListener("click", function(){
    var approved = items.filter(function(it){ return it.status==="승인"; });
    if(!approved.length){ alert("승인된 항목이 없습니다."); return; }
    var blob = new Blob([JSON.stringify(approved, null, 2)], {type:"application/json"});
    var a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "approved.json"; a.click();
  });

  // 로컬 서버로 열렸다면 자동 로드 시도
  fetch("output/manifest.json").then(function(r){ return r.ok ? r.json() : null; }).then(function(d){ if(d) load(d); }).catch(function(){});
</script>
</body>
</html>
