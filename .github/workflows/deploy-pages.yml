name: Deploy landing page + ops console

# 랜딩페이지/리드 폼과 콘텐츠 대행 운영 콘솔을 GitHub Pages 로 무료 배포한다.
# 상권분석은 소개·문서만 올리고, 심의 콘솔은 사내 한정이라 배포하지 않는다.
# 활성화: 저장소 Settings → Pages → Source = "GitHub Actions" 로 설정하면
#         이 브랜치 push 시 자동 배포된다. (비용 발생 없음)

on:
  push:
    branches: [main]
    paths: ["content-agency/**", "cafe-trade-area/**", ".github/pages/**", ".github/workflows/deploy-pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true   # Pages 미설정 시 워크플로우가 자동 활성화 시도
      - name: Assemble site
        # content-agency/ 가 사이트 루트(기존 URL 유지), 상권 분석은 /cafe-trade-area/ 아래.
        # 파이썬 도구·테스트는 웹에서 쓸 것이 아니므로 올리지 않는다.
        #
        # 심의 콘솔(cafe-trade-area/app/)은 '사내 한정 · 대외 배포 금지' 자료라 배포에서 뺀다.
        # 소개 페이지가 4곳에서 app/index.html 을 링크하므로, 파일만 지우면 공개 페이지에
        # 깨진 링크가 남는다. 같은 경로에 안내 페이지를 두어 링크는 살리고 콘솔은 올리지 않는다.
        # (저장소를 받아 로컬로 열면 진짜 콘솔이 그 자리에 있다.)
        run: |
          mkdir -p _site/cafe-trade-area/app
          cp -r content-agency/. _site/
          cp cafe-trade-area/index.html cafe-trade-area/README.md cafe-trade-area/QUICKSTART.md _site/cafe-trade-area/
          cp .github/pages/심의콘솔-안내.html _site/cafe-trade-area/app/index.html
          # 콘솔 자산이 실수로 섞여 들어가지 않았는지 확인 — 섞이면 배포를 중단한다
          if [ -e _site/cafe-trade-area/app/js ] || [ -e _site/cafe-trade-area/app/styles.css ]; then
            echo "심의 콘솔 자산이 배포 산출물에 포함됐습니다"; exit 1
          fi
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
