name: Deploy site

# 회사 메인 + 콘텐츠 대행(랜딩·운영 콘솔) + 상권분석(소개·데이터 입력)을
# GitHub Pages 로 무료 배포한다. 심의 콘솔은 사내 한정이라 배포하지 않는다.
# 활성화: 저장소 Settings → Pages → Source = "GitHub Actions" 로 설정하면
#         이 브랜치 push 시 자동 배포된다. (비용 발생 없음)

on:
  push:
    branches: [main]
    paths: ["index.html", "content-agency/**", "cafe-trade-area/**", ".github/pages/**", ".github/workflows/deploy-pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true   # Pages 미설정 시 워크플로우가 자동 활성화 시도
      - name: Assemble site
        # 사이트 구조
        #   /                     회사 메인 안내 (저장소 루트 index.html)
        #   /content-agency/      콘텐츠 대행 랜딩 + 운영 콘솔 + 문서
        #   /cafe-trade-area/     상권분석 소개 + 문서
        #   /cafe-trade-area/input/   후보지 데이터 입력 (공개 — 입력만 다룬다)
        #   /cafe-trade-area/consult/ 고객 상담 (공개 — 서버 없음, 개인정보는 브라우저 밖으로 안 나간다)
        #   /cafe-trade-area/app/     안내 페이지만. 심의 콘솔은 배포하지 않는다.
        #
        # 심의 콘솔(cafe-trade-area/app/)은 '사내 한정 · 대외 배포 금지' 자료라 배포에서 뺀다.
        # 소개 페이지가 app/index.html 을 링크하므로, 파일만 지우면 공개 페이지에 깨진 링크가
        # 남는다. 같은 경로에 안내 페이지를 두어 링크는 살리고 콘솔은 올리지 않는다.
        # (저장소를 받아 로컬로 열면 진짜 콘솔이 그 자리에 있다.)
        #
        # 파이썬 파이프라인(analysis/)은 웹에서 쓸 것이 아니므로 올리지 않는다.
        run: |
          mkdir -p _site/content-agency _site/cafe-trade-area/app
          cp index.html _site/index.html
          cp -r content-agency/. _site/content-agency/
          cp -r cafe-trade-area/input _site/cafe-trade-area/input
          cp -r cafe-trade-area/consult _site/cafe-trade-area/consult
          # 두 화면이 함께 쓰는 스타일. 빠지면 양쪽 다 스타일 없이 뜬다
          cp -r cafe-trade-area/shared _site/cafe-trade-area/shared
          cp cafe-trade-area/index.html cafe-trade-area/README.md cafe-trade-area/QUICKSTART.md _site/cafe-trade-area/
          cp .github/pages/심의콘솔-안내.html _site/cafe-trade-area/app/index.html
          # 심의 콘솔 자산이 섞여 들어갔는지 확인 — 섞이면 배포를 중단한다
          if [ -e _site/cafe-trade-area/app/js ] || [ -e _site/cafe-trade-area/app/styles.css ]; then
            echo "심의 콘솔 자산이 배포 산출물에 포함됐습니다"; exit 1
          fi
          # 메인 안내가 빠지면 사이트에 현관이 없어진다
          test -s _site/index.html || { echo "회사 메인(index.html)이 없습니다"; exit 1; }
          test -s _site/cafe-trade-area/input/index.html || { echo "데이터 입력 페이지가 없습니다"; exit 1; }
          test -s _site/cafe-trade-area/consult/index.html || { echo "상담 페이지가 없습니다"; exit 1; }
          test -s _site/cafe-trade-area/shared/base.css || { echo "공통 스타일이 없습니다"; exit 1; }
          # 상담 페이지는 개인정보를 다룬다 — 어떤 형태로든 외부 전송 코드가 섞이면 배포를 중단한다
          if grep -rqE 'fetch\(|XMLHttpRequest|sendBeacon|WebSocket' _site/cafe-trade-area/consult/; then
            echo "상담 페이지에 외부 전송 코드가 있습니다"; exit 1
          fi
          # 스스닷컴은 store-scout.com 으로 나갈 별도 사업이다. 한 저장소의 Pages 는
          # 커스텀 도메인을 하나만 갖는다 — 지금은 이 저장소가 회사 사이트를 서비스하므로
          # CNAME 을 만들지 않는다. 도메인을 붙일 때 무엇을 해야 하는지는 DOMAIN.md 에 적어 뒀다.
          # (여기서 CNAME 을 미리 만들면 회사 사이트가 통째로 그 도메인으로 옮겨간다.)
          test -f .github/pages/DOMAIN.md || { echo "도메인 이전 절차 문서가 없습니다"; exit 1; }
          # 알고리즘 내부 설명은 백엔드 문서다 — 공개 서비스 사이트에 올리지 않는다.
          # docs/ 를 복사하지 않으므로 지금은 새어 나갈 길이 없지만, 나중에 누군가
          # cp -r cafe-trade-area/. 로 바꾸면 조용히 딸려 나간다. 그때 여기서 멈춘다.
          if find _site -name '알고리즘.html' | grep -q .; then
            echo "알고리즘 문서가 배포 산출물에 있습니다 — 백엔드 문서입니다"; exit 1
          fi
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
