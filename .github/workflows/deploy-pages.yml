name: Deploy landing page + consoles

# 랜딩페이지/리드 폼과 운영 콘솔들을 GitHub Pages 로 무료 배포한다.
# 활성화: 저장소 Settings → Pages → Source = "GitHub Actions" 로 설정하면
#         이 브랜치 push 시 자동 배포된다. (비용 발생 없음)

on:
  push:
    branches: [main]
    paths: ["content-agency/**", "cafe-trade-area/**", ".github/workflows/deploy-pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true   # Pages 미설정 시 워크플로우가 자동 활성화 시도
      - name: Assemble site
        # content-agency/ 가 사이트 루트(기존 URL 유지), 상권 분석은 /cafe-trade-area/ 아래.
        # 파이썬 도구·테스트는 웹에서 쓸 것이 아니므로 app/ 만 올린다.
        run: |
          mkdir -p _site/cafe-trade-area
          cp -r content-agency/. _site/
          cp -r cafe-trade-area/app _site/cafe-trade-area/app
          cp cafe-trade-area/index.html cafe-trade-area/README.md cafe-trade-area/QUICKSTART.md _site/cafe-trade-area/
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
