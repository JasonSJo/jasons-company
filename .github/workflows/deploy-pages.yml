name: Deploy site

# 회사 메인 + 콘텐츠 대행(랜딩·운영 콘솔)을 GitHub Pages 로 무료 배포한다.
# 상권분석(스스닷컴)은 store-scout 저장소로 이관했다 — 그쪽이 자기 Pages 를
# 가지고 store-scout.com 으로 나간다.
# 활성화: 저장소 Settings → Pages → Source = "GitHub Actions" 로 설정하면
#         이 브랜치 push 시 자동 배포된다. (비용 발생 없음)

on:
  push:
    branches: [main]
    paths: ["index.html", "content-agency/**", ".github/pages/**", ".github/workflows/deploy-pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true   # Pages 미설정 시 워크플로우가 자동 활성화 시도
      - name: Assemble site
        # 사이트 구조
        #   /                     회사 메인 안내 (저장소 루트 index.html)
        #   /content-agency/      콘텐츠 대행 랜딩 + 운영 콘솔 + 문서
        #
        # 상권분석은 여기 없다. store-scout 저장소로 이관했고, 회사 홈의 스스닷컴
        # 카드는 그쪽을 가리킨다.
        run: |
          mkdir -p _site/content-agency
          cp index.html _site/index.html
          cp -r content-agency/. _site/content-agency/
          # 메인 안내가 빠지면 사이트에 현관이 없어진다
          test -s _site/index.html || { echo "회사 메인(index.html)이 없습니다"; exit 1; }
          test -s _site/content-agency/index.html || { echo "콘텐츠 대행 랜딩이 없습니다"; exit 1; }
          # 이관한 것이 되돌아오지 않았는지 — 상권분석은 store-scout 에 있다
          if [ -e _site/cafe-trade-area ]; then
            echo "상권분석이 배포 산출물에 있습니다 — store-scout 저장소로 이관했습니다"; exit 1
          fi
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
