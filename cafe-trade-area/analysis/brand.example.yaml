# 카페 프랜차이즈 출점 심사 파라미터
# 여기 값만 바꾸면 점수·매출추정·손익이 브랜드 기준으로 다시 계산된다.
브랜드: 카페하다
반경_m: 500              # 상권 반경 — 경쟁 POI 집계 기준

# ── 매출 파라미터 ──
객단가_원: 5200
영업일수: 30
영업시간: 13
좌석수_기본: 24          # 후보지 CSV 에 좌석수가 없을 때 쓰는 값
테이크아웃_비중: 0.45    # 이 몫은 좌석 상한을 받지 않는다

# ── 변동비(매출 비례) ──
변동비:
  재료비율: 0.35
  카드수수료율: 0.022
  로열티율: 0.03
  광고분담금율: 0.01

# ── 고정비(월, 만원) ──
고정비:
  최소인건비_월_만원: 620   # 매출이 적어도 이만큼은 든다
  인건비율: 0.20            # 매출이 커지면 인력도 늘어난다 → max(최소, 매출×비율)
  수도광열_월_만원: 85
  소모품_월_만원: 45
  기타_월_만원: 40

# ── 초기투자(만원) ──
초기투자:
  인테리어_평당_만원: 250   # 후보지 CSV 에 인테리어_만원 이 있으면 그 값이 우선
  장비_만원: 4500
  가맹비_만원: 1000
  교육비_만원: 300
